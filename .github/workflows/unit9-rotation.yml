name: Unit 9 log rotation checks

# Run manually only AFTER committing the user's capstone criteria.
on:
  workflow_dispatch:

jobs:
  rotation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test archived logs, size limits, and failure entries
        run: python -m unittest -v test_capstone_rotation.py
